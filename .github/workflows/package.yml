name: Build packages

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: qt_codex1
  PACKAGE_NAME: QWidgetsExamples
  QT_VERSION: "6.8.3"

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: linux
            runner: ubuntu-24.04
            arch: x86_64
          - name: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - name: macos-x64
            os: macos
            runner: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            os: macos
            runner: macos-15
            arch: arm64
          - name: windows-x64
            os: windows
            runner: windows-2022
            arch: x86_64
            msvc_arch: x64
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute package metadata
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
          fi
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "QT_LABEL=qt${QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            fakeroot \
            dpkg-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install cmake ninja qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Windows tools
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install ninja nsis -y --no-progress

      - name: Setup MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt on Windows
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Configure Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build Unix
        if: matrix.os != 'windows'
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Build Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install Unix
        if: matrix.os != 'windows'
        shell: bash
        run: cmake --install build --config Release --prefix "$PWD/stage"

      - name: Install Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: cmake --install build --config Release --prefix "$PWD/stage"

      - name: Deploy Windows Qt runtime
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "stage\bin\qt_codex1.exe"
          windeployqt --release --compiler-runtime --dir (Split-Path $exe) $exe
          if (Test-Path "build\zh_CN.qm") {
            New-Item -ItemType Directory -Force "stage\resources\translations" | Out-Null
            Copy-Item "build\zh_CN.qm" "stage\resources\translations\zh_CN.qm" -Force
          }

      - name: Deploy macOS Qt runtime
        if: matrix.os == 'macos'
        run: |
          APP_PATH="stage/qt_codex1.app"
          if [ -d "$APP_PATH" ]; then
            macdeployqt "$APP_PATH" -verbose=1
          fi

      - name: Create Windows portable archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $outFile = "dist\${{ env.PACKAGE_NAME }}_windows_${{ matrix.arch }}_$($env:PACKAGE_VERSION)_$($env:QT_LABEL).zip"
          Compress-Archive -Path "stage\*" -DestinationPath $outFile -Force

      - name: Create Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          makensis `
            /DAPP_NAME=qt_codex1 `
            /DAPP_EXE=qt_codex1.exe `
            /DAPP_VERSION=$env:PACKAGE_VERSION `
            /DAPP_ARCH=${{ matrix.arch }} `
            /DSTAGE_DIR="$PWD\stage" `
            /DOUT_FILE="$PWD\dist\${{ env.PACKAGE_NAME }}_windows_${{ matrix.arch }}_$($env:PACKAGE_VERSION)_$($env:QT_LABEL)_setup.exe" `
            packaging\windows\installer.nsi

      - name: Create macOS portable archive
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "stage/qt_codex1.app" "dist/${{ env.PACKAGE_NAME }}_macos_${{ matrix.arch }}_${PACKAGE_VERSION}_${QT_LABEL}.zip"

      - name: Create macOS DMG installer
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          macdeployqt "stage/qt_codex1.app" -dmg -verbose=1
          mv "stage/qt_codex1.dmg" "dist/${{ env.PACKAGE_NAME }}_macos_${{ matrix.arch }}_${PACKAGE_VERSION}_${QT_LABEL}.dmg"

      - name: Create Linux portable archive
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          tar -C stage -czf "dist/${{ env.PACKAGE_NAME }}_linux_${{ matrix.arch }}_${PACKAGE_VERSION}_${QT_LABEL}.tar.gz" .

      - name: Create Linux DEB installer
        if: matrix.os == 'linux'
        run: |
          cmake --build build --target package --config Release
          mkdir -p dist
          cp build/*.deb "dist/${{ env.PACKAGE_NAME }}_linux_${{ matrix.arch }}_${PACKAGE_VERSION}_${QT_LABEL}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qt_codex1-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: package
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: QWidgetsExamples ${{ github.ref_name }}
          files: release-assets/*
          body: |
            QWidgetsExamples ${{ github.ref_name }}

            Built with Qt ${{ env.QT_VERSION }}.

            Packages include installer and portable builds for Windows, macOS, and Linux.
